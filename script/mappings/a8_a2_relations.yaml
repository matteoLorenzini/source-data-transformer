name: Lynx-US-relations
source: relations
namespaces:
  lynx: http://www.lynx.com/resource/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  crmcsi: http://www.cidoc-crm.org/extensions/crmsci/
  skos: http://www.w3.org/2004/02/skos/core#
  crmarchaeo: http://www.cidoc-crm.org/extensions/crmarchaeo/
generators:
  URIwithType:
    pattern: '{text}'
    prefix: lynx
  URIwithTypeAndId:
    pattern: '{type}/{id}'
    prefix: lynx
rules:
- domain: /scheda/row
  entity:
    types:
    - crmarchaeo:A2_Stratigraphic_Volume_Unit
    uri:
      generator: URIwithTypeAndId
      args:
        type:
          const: stratigraphic-unit
        id: US_ID/text()
  links:
  - range: Sequenza_fisica_uguale_a_US_ID/value
    predicate: crmarchaeo:AP11_has_physical_relation_to
    when:
      exists: text()
    entity:
      types:
      - crmarchaeo:A2_Stratigraphic_Volume_Unit
      uri:
        generator: URIwithTypeAndId
        args:
          type:
            const: stratigraphic-unit
          id: text()
      additional:
      - predicate: crm:P2_has_type
        entity:
          types:
          - crm:E55_Type
          uri:
            generator: URIwithType
            args:
              text:
                const: uguale-a
  - range: Sequenza_fisica_si_lega_a_US_ID/value
